<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 80px;
      background: rgba(0, 0, 0, 0.95);
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-radius: 8px;
      backdrop-filter: blur(8px);
      -webkit-app-region: no-drag;
    }
    #pulse {
      width: 10px;
      height: 10px;
      background: #ff3b30;
      border-radius: 50%;
      animation: pulse 1s infinite;
      box-shadow: 0 0 6px #ff3b30;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
    }
    #label {
      font-weight: 500;
      flex: 1;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #close {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255,255,255,0.2);
      cursor: pointer;
      transition: background 0.2s;
      -webkit-app-region: no-drag;
    }
    #close:hover {
      background: rgba(255,255,255,0.3);
    }
    #close::before {
      content: '×';
      color: white;
      font-size: 12px;
      font-weight: bold;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div id="pulse"></div>
  <div id="label">Listening...</div>
  <div id="close" title="Stop recording"></div>
  <script>
    const { ipcRenderer } = require('electron');
    const closeEl = document.getElementById('close');
    
    closeEl.addEventListener('click', () => {
      ipcRenderer.send('stop-recording');
    });
    
    ipcRenderer.on('start-timer', () => {
      // Just show listening state, no timer needed
    });
    
    ipcRenderer.on('stop-timer', () => {
      // Timer stopped
    });
  </script>
</body>
</html>
