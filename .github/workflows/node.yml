name: Node and Python tests, syntax and safety checks
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check core and voice
        run: |
          find src -type f \( -name '*.mjs' -o -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run offline unit/integration tests with mocked Ollama
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if npm test > test-output.txt 2>&1; then
            cat test-output.txt
          else
            cat test-output.txt
            if [ "${{ github.event_name }}" = "push" ]; then
              { echo 'v1.4 CI diagnostic:'; echo '~~~'; tail -n 180 test-output.txt; echo '~~~'; } > test-report.md
              gh pr comment 3 --body-file test-report.md || true
            fi
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python daemon and installer
        run: python -m py_compile src/ui/voice-control/headless_voice.py scripts/install-launchagents.py scripts/test_launchagents.py
      - name: Test LaunchAgent plist and headless imports
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
