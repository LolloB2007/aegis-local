name: Aegis v2 release candidate validation
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check core and voice
        run: |
          find src -type f \( -name '*.mjs' -o -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run offline unit/integration tests with mocked Ollama
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if npm test > unit-report.txt 2>&1; then
            cat unit-report.txt
          else
            cat unit-report.txt
            if [ "${{ github.event_name }}" = "push" ]; then
              { echo 'Aegis v2.1 test diagnostic (temporary):'; echo '~~~'; tail -n 180 unit-report.txt; echo '~~~'; } > diagnostic.md
              gh pr comment 5 --body-file diagnostic.md || true
            fi
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python native UI, voice daemon and installer
        run: python -m py_compile src/ui/native/*.py src/ui/voice-control/headless_voice.py scripts/*.py
      - name: Test LaunchAgent plist and headless imports
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  macos-native-import:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native UI dependencies
        run: python -m pip install -r requirements-native.txt
      - name: Import PyObjC controller and verify fullscreen constants
        run: |
          python -c "import AppKit as a; assert a.NSWindowCollectionBehaviorCanJoinAllSpaces; assert a.NSWindowCollectionBehaviorFullScreenAuxiliary; assert a.NSWindowCollectionBehaviorStationary; assert a.NSPopUpMenuWindowLevel"
          python -c "import sys; sys.path.insert(0,'src/ui/native'); import app; assert app.WIDTH == 402; print('PyObjC v2 import smoke test passed')"
      - name: Validate panel API constants and NSObject initialization
        run: |
          python -c "import AppKit as a; names=['NSBezelStyleRounded','NSNoBorder','NSViewWidthSizable','NSVariableStatusItemLength','NSWindowStyleMaskNonactivatingPanel','NSPasteboardTypeString']; assert all(hasattr(a,n) for n in names), [n for n in names if not hasattr(a,n)]"
          python -c "import sys; sys.path.insert(0,'src/ui/native'); import app; controller=app.AegisController.alloc().init(); assert controller is not None; print('AppKit controller initialized')"
      - name: Check Python support code on macOS
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
