name: Aegis v2 release candidate validation
on:
  pull_request:
  push:
    branches: [main, "feat/**"]
permissions:
  contents: read
  pull-requests: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax-check core and voice
        run: |
          find src -type f \( -name '*.mjs' -o -name '*.js' -o -name '*.cjs' \) -print0 | xargs -0 -n1 node --check
      - name: Run offline unit/integration tests with mocked Ollama
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python native UI, voice daemon and installer
        run: python -m py_compile src/ui/native/*.py src/ui/voice-control/headless_voice.py scripts/*.py
      - name: Test LaunchAgent plist and headless imports
        run: python -m unittest discover -s scripts -p 'test_*.py' -v

  macos-native-import:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install native UI dependencies
        run: python -m pip install -r requirements-native.txt
      - name: Import PyObjC controller and verify fullscreen constants
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python -c "import AppKit as a; assert a.NSWindowCollectionBehaviorCanJoinAllSpaces; assert a.NSWindowCollectionBehaviorFullScreenAuxiliary; assert a.NSWindowCollectionBehaviorStationary; assert a.NSPopUpMenuWindowLevel" > native-smoke.txt 2>&1
          first=$?
          python -c "import sys; sys.path.insert(0,'src/ui/native'); import app; assert app.WIDTH == 402; print('PyObjC v2 import smoke test passed')" >> native-smoke.txt 2>&1
          second=$?
          cat native-smoke.txt
          if [ "$first" != "0" ] || [ "$second" != "0" ]; then
            { echo 'macOS native smoke diagnostic:'; echo '~~~'; tail -n 160 native-smoke.txt; echo '~~~'; } > native-report.md
            gh pr comment 4 --body-file native-report.md || true
            exit 1
          fi
      - name: Check Python support code on macOS
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
